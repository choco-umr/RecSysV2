<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Hello, world!</title>
  </head>
  <body>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>

    <div id="alertBox" class="alert alert-danger" role="alert"></div>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
        <div class="card-body p-4">
          <h2 class="card-title text-center mb-4">Create an account</h2>

          <form id="registerForm" action="/register" method="POST">
            
            <div class="mb-3">
              <label for="Firstname" class="form-label">Firstname</label>
              <input type="text" class="form-control" id="Firstname" placeholder="Firstname here" required>
            </div>

            <div class="mb-3">
              <label for="Lastname" class="form-label">Lastname</label>
              <input type="text" class="form-control" id="Lastname" placeholder="Lastname here" required>
            </div>

            <div class="mb-3">
              <label for="Username" class="form-label">Username</label>
              <input type="Username" class="form-control" id="Username" placeholder="Username here" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">password</label>
              <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Preferred Categories</label>
              <div id="categoryCheckboxes"></div>
            </div>

            <div class="mb-3">
              <label for="Age" class="form-label">Age</label>
              <input type="Age" class="form-control" id="Age" placeholder="Age here" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>

          <p class="text-center mt-3 mb-0">
            <a href="login.html">Log in here</a>
          </p>



      
          <script>

            async function loadCategories() {
            const response = await fetch("http://localhost:8000/api/frontend_helper_router/get_categories");
              const categories = await response.json();
              const container = document.getElementById("categoryCheckboxes");

              categories.forEach((category) => {
                const wrapper = document.createElement("div");
                wrapper.className = "form-check";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "form-check-input";
                checkbox.id = `category-${category}`;
                checkbox.value = category;

                const label = document.createElement("label");
                label.className = "form-check-label";
                label.setAttribute("for", `category-${category}`);
                label.textContent = category;

                wrapper.appendChild(checkbox);
                wrapper.appendChild(label);
                container.appendChild(wrapper);
              });
            }

            loadCategories();

            </script>

            <script>
              document.getElementById("registerForm").addEventListener("submit", async (event) => {
                  event.preventDefault();

                  const response = await fetch("http://localhost:8000/api/user_routes/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      firstname: document.getElementById("Firstname").value,
                      lastname: document.getElementById("Lastname").value,
                      username: document.getElementById("Username").value,
                      password: document.getElementById("password").value,
                      gender: "Male",
                      age: Number(document.getElementById("Age").value),
                      preferred_categories: Array.from(document.querySelectorAll('#categoryCheckboxes input[type="checkbox"]:checked')).map(cb => cb.value)
                    })
                  });

                  const data = await response.json();
                  const alertBox = document.getElementById("alertBox");
                  if (data.success) {
                    alertBox.classList.remove("alert-danger");
                    alertBox.classList.add("alert-success");
                    alertBox.textContent = "Success! Redirecting..."; // friendly message instead of raw JSON
                    alertBox.classList.remove("d-none");

                    window.location.href = "login.html";


                  } else {
                    alertBox.classList.remove("alert-success");
                    alertBox.classList.add("alert-danger");
                    alertBox.textContent = JSON.stringify(data);
                    alertBox.classList.remove("d-none");
                  }

                });
          </script>

          




        </div>
      </div>
    </div>
    -->
  </body>
</html>
