<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Hello, world!</title>
  </head>
  <body>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
        <div class="card-body p-4">
          <h2 class="card-title text-center mb-4">Login</h2>

          <form id="LoginForm" action="/login" method="POST">

            <div class="mb-3">
              <label for="Username" class="form-label">Username</label>
              <input type="Username" class="form-control" id="Username" placeholder="Username here" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">password</label>
              <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <p class="text-center mt-3 mb-0">
             <a href="register.html">Register here</a>
          </p>

          <a class="nav-link" href="#" id="logoutLink">Logout</a>






          <script>
              document.getElementById("LoginForm").addEventListener("submit", async (event) => {
              event.preventDefault();
              const response = await fetch("http://localhost:8000/api/global_routes/login", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  username: document.getElementById("Username").value,
                  password: document.getElementById("password").value,
                })
              });
              const data = await response.json();
              const alertBox = document.getElementById("alertBox");

              if (data.success) {
                alertBox.classList.remove("alert-danger");
                alertBox.classList.add("alert-success");
                alertBox.textContent = "Success! Redirecting...";
                alertBox.classList.remove("d-none");

                const roleRedirects = {
                  Users: "UserPages/UserHome.html",
                  Researchers: "ResearcherPages/ResearcherHome.html",
                  Admins: "AdminPages/AdminHome.html",
                };

                const redirectTo = roleRedirects[data.role];
                if (redirectTo) {
                  window.location.href = redirectTo;
                } else {
                  console.error("Unknown role returned from login:", data.role);
                  alertBox.classList.remove("alert-success");
                  alertBox.classList.add("alert-danger");
                  alertBox.textContent = "Login succeeded but role is unrecognized.";
                }
              } else {
                alertBox.classList.remove("alert-success");
                alertBox.classList.add("alert-danger");
                // FastAPI's default HTTPException error body is {"detail": "..."},
                // not {"message": "..."} - IncorrectLoginDetails/JWTFound/etc. all
                // come back that way, so "detail" has to be checked too or every
                // failure just silently falls through to the generic fallback text.
                alertBox.textContent = data.message || data.detail || "Login failed.";
                alertBox.classList.remove("d-none");
              }
            });
          </script>

          <script>
            document.getElementById("logoutLink").addEventListener("click", async (event) => {
              event.preventDefault(); // stop the "#" link from just jumping to top of page

              await fetch("http://localhost:8000/api/global_routes/Logout", {
                method: "POST",
                credentials: "include" // needed so the browser sends the access_token cookie to be cleared
              });

              window.location.href = "../login.html";
            });

    </script>


        </div>
      </div>
    </div>
    -->
  </body>
</html>
